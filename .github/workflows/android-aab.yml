name: Android AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-aab:
    name: Build signed AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Restore Android signing files
        run: |
          printf '%s' "${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}" | base64 --decode > android/app/shadow-wallet-upload.keystore
          {
            echo "storeFile=shadow-wallet-upload.keystore"
            echo "storePassword=${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}"
          } > android/keystore.properties

      - name: Compute version
        run: |
          version_code=$((100 + GITHUB_RUN_NUMBER))
          echo "VERSION_CODE=${version_code}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "versionCode=${version_code}" >> "$GITHUB_STEP_SUMMARY"

      - name: Build release bundle
        working-directory: android
        run: ./gradlew bundleRelease -PVERSION_CODE="${VERSION_CODE}" -PVERSION_NAME="${VERSION_NAME}"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: shadow-wallet-release-aab-v${{ env.VERSION_CODE }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
